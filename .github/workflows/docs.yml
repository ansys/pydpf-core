name: docs # zizmor: ignore[concurrency-limits] , this is a reusable workflow

on:
# Can be called by the CI
  workflow_call:
    inputs:
      python_version:
        required: false
        type: string
        default: "3.12"
      ANSYS_VERSION:
        required: false
        type: string
      standalone_suffix:
        description: "Suffix of the branch on standalone"
        required: false
        type: string
        default: ''
      event_name:
        description: "Name of event calling"
        required: true
        type: string
        default: ''
    secrets:
      LICENSE_SERVER:
        required: true
      PYANSYS_CI_BOT_TOKEN:
        required: true
# Can be called manually
  workflow_dispatch:
    inputs:
      python_version:
        description: "Python interpreter"
        required: true
        type: string
        default: "3.12"
      ANSYS_VERSION:
        description: "ANSYS version"
        required: false
        type: string
      standalone_suffix:
        description: "Suffix of the branch on standalone"
        required: false
        type: string
        default: ''

env:
  PACKAGE_NAME: ansys-dpf-core
  MODULE: core

permissions: {}

jobs:
  doc-style:
    name: "Check doc style" # zizmor: ignore[concurrency-limits] , this is a reusable workflow
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Required for doc-style action to post comments
    steps:
        - name: "Running documentation style checks"
          uses: ansys/actions/doc-style@87ff2e65e8884121f9afc97728ca9f213228ecc2 # v11.1.4
          with:
            token: ${{ secrets.GITHUB_TOKEN }}

  docs:
    name: "Documentation" # zizmor: ignore[concurrency-limits] , this is a reusable workflow
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      ANSYS_DPF_WHEEL_PLATFORM: "any"
      UV_PYTHON: ${{ inputs.python_version }}
      # `uv sync` is run explicitly below, this variable is needed to prevent re-syncing on `uv run`.
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Set licensing"
        shell: bash
        env:
          LICENSE_SERVER: ${{ secrets.LICENSE_SERVER }}
        run: |
          echo "ANSYS_DPF_ACCEPT_LA=Y" >> $GITHUB_ENV
          echo "ANSYSLMD_LICENSE_FILE=1055@${LICENSE_SERVER}" >> $GITHUB_ENV
          echo "DPF_DEFAULT_GRPC_MODE=insecure" >> $GITHUB_ENV

      - name: "Setup Python"
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python_version }}

      - name: "Install uv"
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - name: "Install tox"
        shell: pwsh
        run: |
          uv sync --only-group tox

      - name: "Install DPF"
        id: set-server-path
        uses: ansys/pydpf-actions/install-dpf-server@c672fc3844d1606e8dc650ee3ab634be7ea60916 # v2.4
        with:
          dpf-standalone-TOKEN: ${{secrets.PYANSYS_CI_BOT_TOKEN}}
          standalone_suffix: ${{ inputs.standalone_suffix }}
          ANSYS_VERSION : ${{inputs.ANSYS_VERSION}}
          skip-python-install: "true"

      - name: "Expose the standalone DPF server to tox"
        id: dpf-standalone
        if: env.MODE == 'PIP'
        shell: bash
        env:
          STANDALONE_PATH: ${{ steps.set-server-path.outputs.standalone-path }}
        run: |
          echo "requirement=-e ${STANDALONE_PATH}" >> "$GITHUB_OUTPUT"

      - name: "Setup headless display"
        uses: pyvista/setup-headless-display-action@10e6efb97af3cd1523828f0e22c39f0e4567f3e4 # v5.2.0

      - name: "Setup Graphviz"
        uses: ts-graphviz/setup-graphviz@b1de5da23ed0a6d14e0aeee8ed52fdd87af2363c # v2.0.2

      - name: "Install OS packages"
        run: |
          choco install pandoc

      - name: "Setup Quarto"
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: 1.6.43

      - name: Check Quarto Version
        shell: bash
        run: |
          quarto --version

      - name: Verify tinytex is installed
        run: |
          quarto install tinytex --no-prompt --update-path

      - name: "Install Poppler for PDF to PNG conversion"
        shell: powershell
        run: |
          choco install poppler -y
          echo "C:\Program Files\poppler\bin" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8

      - name: Install Miktex and update PATH with Miktex binaries
        shell: powershell
        run: |
          choco install miktex -y
          echo "C:\Program Files\MiKTeX\miktex\bin\x64" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8

      - name: Set up Miktex to automatically install packages
        shell: powershell
        run: |
          initexmf --set-config-value [MPM]AutoInstall=1

      - name: "Restore doc build cache"
        id: cache-doc-build-restore
        # zizmor: ignore[cache-poisoning] - cache is for doc build only, not release artifacts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # This list MUST stay strictly identical to the one of the "Save doc-build cache" step.
          path: |
            doc/build/.doctrees
            doc/source/api
            doc/source/examples
            doc/source/tutorials
            doc/source/images/auto-generated
          key: doc-build-${{ github.ref_name }}-DPF_${{inputs.ANSYS_VERSION}}${{inputs.standalone_suffix}}-${{hashfiles('uv.lock', 'pyproject.toml')}}-${{ github.run_id }}
          # Pull requests can only read caches from their own ref and from the default branch,
          # hence the fallback on "main".
          restore-keys: |
            doc-build-${{ github.ref_name }}-DPF_${{inputs.ANSYS_VERSION}}${{inputs.standalone_suffix}}-${{hashfiles('uv.lock', 'pyproject.toml')}}-
            doc-build-${{ github.ref_name }}-DPF_${{inputs.ANSYS_VERSION}}${{inputs.standalone_suffix}}-
            doc-build-main-DPF_${{inputs.ANSYS_VERSION}}${{inputs.standalone_suffix}}-${{hashfiles('uv.lock', 'pyproject.toml')}}-
            doc-build-main-DPF_${{inputs.ANSYS_VERSION}}${{inputs.standalone_suffix}}-

      - name: "Restore tracked doc sources overwritten by the cache"
        # The cached output directories also hold files tracked by git, which the cache
        # would otherwise silently revert to their state at the time the cache was saved.
        shell: bash
        run: |
          git checkout -- doc/source/api doc/source/examples doc/source/tutorials

      - name: "Build HTML Documentation"
        shell: bash
        env:
          DPF_STANDALONE_REQUIREMENT: ${{ steps.dpf-standalone.outputs.requirement }}
        run: |
          uv run tox -e doc-html

      - name: "Save doc-build cache"
        id: cache-doc-build-save
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Keep strictly identical to the path list of the "Restore doc build cache" step.
          path: |
            doc/build/.doctrees
            doc/source/api
            doc/source/examples
            doc/source/tutorials
            doc/source/images/auto-generated
          key: ${{ steps.cache-doc-build-restore.outputs.cache-primary-key }}

      - name: "Zip HTML Documentation"
        shell: pwsh
        run: |
          Compress-Archive -Path doc/build/html/* -Destination documentation-html.zip
        if: always()

      - name: "Upload HTML Documentation"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-html
          path: documentation-html.zip
        if: always()

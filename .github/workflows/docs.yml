name: Install DPF for documentation # zizmor: ignore[concurrency-limits] , this is a reusable workflow

on:
  workflow_call:
    inputs:
      python_version:
        required: false
        type: string
        default: "3.12"
      ANSYS_VERSION:
        required: false
        type: string
      standalone_suffix:
        description: "Suffix of the branch on standalone"
        required: false
        type: string
        default: ''
      event_name:
        description: "Name of event calling"
        required: true
        type: string
        default: ''
    secrets:
      PYANSYS_CI_BOT_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      python_version:
        description: "Python interpreter"
        required: true
        type: string
        default: "3.12"
      ANSYS_VERSION:
        description: "ANSYS version"
        required: false
        type: string
      standalone_suffix:
        description: "Suffix of the branch on standalone"
        required: false
        type: string
        default: ''

permissions: {}

jobs:
  docs:
    name: "Install DPF for documentation"
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: "Setup Python"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python_version }}

      - name: "Install uv"
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: "Install DPF"
        id: set-server-path
        uses: ansys/pydpf-actions/install-dpf-server@feat/update-actions-for-uv # zizmor: ignore[unpinned-uses] TODO: pin to a released pydpf-actions tag
        with:
          dpf-standalone-TOKEN: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}
          standalone_suffix: ${{ inputs.standalone_suffix }}
          ANSYS_VERSION: ${{ inputs.ANSYS_VERSION }}
          skip-python-install: "true"

name: CI Release

on:
  push:
    tags:
      - "v*"
  schedule:
    - cron: "0 13 * * 0"
  workflow_dispatch:
    inputs:
      ansys_version:
        description: "ANSYS version"
        required: false
        type: string
      standalone_branch_suffix:
        description: 'Suffix of the branch on standalone'
        required: false
        default: ''

#┌───────────── minute (0 - 59)
#│ ┌───────────── hour (0 - 23)
#│ │ ┌───────────── day of the month (1 - 31)
#│ │ │ ┌───────────── month (1 - 12)
#│ │ │ │ ┌───────────── day of the week (0 - 6), 0 being Sunday
#│ │ │ │ │
#│ │ │ │ │
#│ │ │ │ │
#* * * * *

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCUMENTATION_CNAME: 'dpf.docs.pyansys.com'
  PACKAGE_NAME: 'ansys-dpf-core'

jobs:

  update-changelog:
    name: "Update CHANGELOG for new tag"
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to push commits, delete and create tags
      pull-requests: write  # Required to create pull requests
    steps:
      - uses: ansys/actions/doc-deploy-changelog@f5e1481b9c128197a30d1dc1dfc52b8cd6865555 # v11.1.5
        with:
          token: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}
          bot-user: ${{ secrets.PYANSYS_CI_BOT_USERNAME }}
          bot-email: ${{ secrets.PYANSYS_CI_BOT_EMAIL }}

  debug:
    name: "Debug"
    runs-on: ubuntu-latest
    steps:
    - name: Show the Github context for the triggered event
      run: echo "$GITHUB_CONTEXT"
      env:
        GITHUB_CONTEXT: ${{ toJson(github) }}

  style:
    name: "Style Check"
    needs: [debug]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: ansys/actions/code-style@f5e1481b9c128197a30d1dc1dfc52b8cd6865555 # v11.1.5
        with:
          use-python-cache: false

  build-wheels:
    name: "Build ${{matrix.name}} wheel"
    needs: [style]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      ANSYS_DPF_WHEEL_PLATFORM: ${{matrix.platform-tag}}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'any'
            platform-tag: 'any'
            os: ubuntu-latest
          - name: 'linux1'
            platform-tag: 'manylinux1'
            os: ubuntu-latest
          - name: 'linux'
            platform-tag: 'manylinux_2_17'
            os: ubuntu-latest
          - name: 'windows'
            platform-tag: 'win'
            os: windows-latest
    steps:
      - uses: ansys/actions/build-library@f5e1481b9c128197a30d1dc1dfc52b8cd6865555 # v11.1.5
        with:
          library-name: "ansys-dpf-core-${{ matrix.name }}"

  tests:
    name: "Test ${{ matrix.test_any && 'any' || 'platform-specific' }} wheel"
    needs: [style]
    permissions:
      contents: read # Required by tests.yml jobs
    strategy:
      fail-fast: false
      matrix:
        include:
          - python_versions: '["3.10"]'
            wheelhouse: true
            DOCSTRING: true
            test_any: false
          - python_versions: '["3.11", "3.12", "3.13", "3.14"]'
            wheelhouse: true
            DOCSTRING: false
            test_any: false
          - python_versions: '["3.10","3.11", "3.12", "3.13", "3.14"]'
            wheelhouse: false
            DOCSTRING: false
            test_any: true
    uses: $/.github/workflows/tests.yml
    with:
      ANSYS_VERSION: ${{ inputs.ansys_version || fromJson(vars.ANSYS_VERSION_LAST_RELEASED_WITH_PATCH).version }}
      python_versions: ${{ matrix.python_versions }}
      wheelhouse: ${{ matrix.wheelhouse }}
      DOCSTRING: ${{ matrix.DOCSTRING }}
      test_any: ${{ matrix.test_any }}
      standalone_suffix: ${{ github.event.inputs.standalone_branch_suffix || fromJson(vars.ANSYS_VERSION_LAST_RELEASED_WITH_PATCH).patch }}
    secrets:
      LICENSE_SERVER: ${{ secrets.LICENSE_SERVER }}
      PYANSYS_CI_BOT_TOKEN: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  docs:
    name: "Build the documentation"
    needs: [style]
    permissions:
      contents: read # Required by docs.yml jobs
      pull-requests: write # Required by doc-style job
    uses: $/.github/workflows/docs.yml
    with:
      ANSYS_VERSION: ${{ inputs.ansys_version || fromJson(vars.ANSYS_VERSION_LAST_RELEASED_WITH_PATCH).version }}
      standalone_suffix: ${{ github.event.inputs.standalone_branch_suffix || fromJson(vars.ANSYS_VERSION_LAST_RELEASED_WITH_PATCH).patch }}
      event_name: ${{ github.event_name }}
    secrets:
      LICENSE_SERVER: ${{ secrets.LICENSE_SERVER }}
      PYANSYS_CI_BOT_TOKEN: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}

  examples:
    name: "Run examples"
    needs: [style]
    permissions:
      contents: read # Required by examples.yml jobs
    uses: $/.github/workflows/examples.yml
    with:
      ANSYS_VERSION: ${{ inputs.ansys_version || fromJson(vars.ANSYS_VERSION_LAST_RELEASED_WITH_PATCH).version }}
      python_versions: '["3.10", "3.11", "3.12", "3.13", "3.14"]'
      standalone_suffix: ${{ github.event.inputs.standalone_branch_suffix || fromJson(vars.ANSYS_VERSION_LAST_RELEASED_WITH_PATCH).patch }}
    secrets:
      LICENSE_SERVER: ${{ secrets.LICENSE_SERVER }}
      PYANSYS_CI_BOT_TOKEN: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}

  tests-retro:
    name: "Test DPF ${{ matrix.version.version }}${{ matrix.version.patch }} compatibility"
    needs: [style]
    permissions:
      contents: read # Required by tests.yml jobs
    strategy:
      fail-fast: false
      matrix:
        version:
          - ${{ fromJson(vars.ANSYS_VERSIONS_RETRO_WITH_PATCH) }}
    uses: $/.github/workflows/tests.yml
    with:
      ANSYS_VERSION: ${{ matrix.version.version }}
      python_versions: '["3.10"]'
      DOCSTRING: false
      standalone_suffix: ${{ matrix.version.patch }}
    secrets:
      LICENSE_SERVER: ${{ secrets.LICENSE_SERVER }}
      PYANSYS_CI_BOT_TOKEN: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  tests-pydpf-post:
    name: "Test PyDPF-Post with ${{ matrix.version.version }}${{ matrix.version.patch }}"
    needs: [style]
    permissions:
      contents: read # Required by pydpf-post.yml jobs
      pull-requests: write # Required for posting test outcome comments
    strategy:
      fail-fast: false
      matrix:
        version:
          - ${{ fromJson(vars.ANSYS_VERSIONS_RETRO_WITH_PATCH) }}
        test_docstrings:
          - "false"
        include:
          - version: ${{ fromJson(vars.ANSYS_VERSION_LAST_RELEASED_WITH_PATCH) }}
            test_docstrings": "true"
    uses: $/.github/workflows/pydpf-post.yml
    with:
      ANSYS_VERSION: ${{ matrix.version.version }}
      standalone_suffix: ${{ matrix.version.patch }}
      test_docstrings: ${{ matrix.test_docstrings }}
      post_branch: latest
    secrets:
      LICENSE_SERVER: ${{ secrets.LICENSE_SERVER }}
      PYANSYS_CI_BOT_TOKEN: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}

  docker_tests:
    name: "Build and Test on Docker"
    needs: [style]
    permissions:
      contents: read # Required by test_docker.yml jobs
    uses: $/.github/workflows/test_docker.yml
    with:
      ANSYS_VERSION: ${{ inputs.ansys_version || fromJson(vars.ANSYS_VERSION_LAST_RELEASED_WITH_PATCH).version }}
      standalone_suffix: ${{ github.event.inputs.standalone_branch_suffix || fromJson(vars.ANSYS_VERSION_LAST_RELEASED_WITH_PATCH).patch }}
    secrets:
      LICENSE_SERVER: ${{ secrets.LICENSE_SERVER }}
      PYANSYS_CI_BOT_TOKEN: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  docker_examples:
    name: "Run examples on Docker"
    needs: [style]
    permissions:
      contents: read # Required by examples_docker.yml jobs
    uses: $/.github/workflows/examples_docker.yml
    with:
      ANSYS_VERSION: ${{ inputs.ansys_version || fromJson(vars.ANSYS_VERSION_LAST_RELEASED_WITH_PATCH).version }}
      python_versions: '["3.10", "3.11", "3.12", "3.13", "3.14"]'
      standalone_suffix: ${{ github.event.inputs.standalone_branch_suffix || fromJson(vars.ANSYS_VERSION_LAST_RELEASED_WITH_PATCH).patch }}
    secrets:
      LICENSE_SERVER: ${{ secrets.LICENSE_SERVER }}
      PYANSYS_CI_BOT_TOKEN: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}

  release-github:
    name: "Release project to GitHub"
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build-wheels, tests, docs, examples, tests-retro, docker_tests]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # Required for GitHub release
      contents: write # Required for GitHub release
    steps:
      - name: Release to GitHub
        uses: ansys/actions/release-github@f5e1481b9c128197a30d1dc1dfc52b8cd6865555 # v11.1.5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          library-name: ${{ env.PACKAGE_NAME }}
          add-artifact-attestation-notes: true
          changelog-release-notes: true

  release-pypi:
    name: "Release project to PyPI"
    needs: [release-github]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # Required for OIDC authentication with PyPI
      contents: read
    steps:
      - name: "Download Release Assets"
        uses: robinraju/release-downloader@28fc21f50d76778e7023361aa1f863e717d3d56f # v1.13
        with:
          tag: ${{ github.ref_name }}
          fileName: "*.whl"
          tarBall: false
          zipBall: false
          out-file-path: "assets"
          extract: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Upload artifacts to PyPI using trusted publisher"
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: "https://upload.pypi.org/legacy/"
          print-hash: true
          packages-dir: assets
          skip-existing: true

  upload-stable-docs:
    name: "Upload stable documentation"
    needs: [release-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for deploying documentation to gh-pages
    steps:
      - name: "Deploy the stable documentation"
        uses: ansys/actions/doc-deploy-stable@f5e1481b9c128197a30d1dc1dfc52b8cd6865555 # v11.1.5
        with:
          cname: ${{ env.DOCUMENTATION_CNAME }}
          token: ${{ secrets.GITHUB_TOKEN }}
          bot-user: ${{ secrets.PYANSYS_CI_BOT_USERNAME }}
          bot-email: ${{ secrets.PYANSYS_CI_BOT_EMAIL }}

  update-ansys-lab-examples:
    permissions:
      contents: write # Required by ansys_lab.yml deploy_examples job for git push
    uses: $/.github/workflows/ansys_lab.yml
    needs: [release-pypi]
    with:
      version: ${{ github.ref_name }}
    secrets:
      PYANSYS_CI_BOT_TOKEN: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}

name: Install DPF on Docker # zizmor: ignore[concurrency-limits] , this is a reusable workflow

on:
  workflow_call:
    inputs:
      standalone_suffix:
        description: "Suffix of the branch on standalone"
        required: false
        type: string
        default: ''
      ANSYS_VERSION:
        required: false
        type: string
    secrets:
      PYANSYS_CI_BOT_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      standalone_suffix:
        description: "Suffix of the branch on standalone"
        required: false
        type: string
        default: ''
      ANSYS_VERSION:
        description: "ANSYS version to run."
        required: false
        type: string

permissions: {}

jobs:
  docker_tests:
    name: "Install DPF on Docker"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: "Install DPF"
        id: set-server-path
        uses: ansys/pydpf-actions/install-dpf-docker@195207a462b23da5645fde44ac685e81b29035a4 # v2.3
        with:
          dpf-standalone-TOKEN: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}
          standalone_suffix: ${{ inputs.standalone_suffix }}
          ANSYS_VERSION: ${{ inputs.ANSYS_VERSION || vars.ANSYS_VERSION_DEFAULT }}

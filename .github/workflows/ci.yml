name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches-ignore:
      - '*no-ci*'
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ansys_version:
        description: "ANSYS version"
        required: false
        type: string
      standalone_branch_suffix:
        description: 'Suffix of the branch on standalone'
        required: false
        default: ''

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  pick_server_suffix:
    name: "Pick Server Suffix"
    runs-on: ubuntu-latest
    outputs:
      suffix: ${{ steps.step1.outputs.suffix }}
    steps:
    - id: step1
      name: Define server branch suffix to use
      env:
        EVENT_NAME: ${{ github.event_name }}
        STANDALONE_BRANCH_SUFFIX: ${{ github.event.inputs.standalone_branch_suffix }}
        HEAD_REF: ${{ github.head_ref }}
        BASE_REF: ${{ github.base_ref }}
      run: |
        if [[ "${EVENT_NAME}" == "push" ]]; then
          echo "suffix=" >> "$GITHUB_OUTPUT"
        elif [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
          echo "suffix=${STANDALONE_BRANCH_SUFFIX}" >> "$GITHUB_OUTPUT"
        elif [[ "${EVENT_NAME}" == "pull_request" ]]; then
          sub='maint/update_code_for_'
          if [[ "${HEAD_REF}" == *"$sub"* ]]; then
            ref_name=${HEAD_REF}
            base_ref=${BASE_REF}
            suffix=${ref_name/$sub[0-9][0-9][0-9]/''}
            suffix=${suffix/_on_$base_ref/''}
          elif [[ "${BASE_REF}" == *"$sub"* ]]; then
            base_ref=${BASE_REF}
            suffix=${base_ref/$sub[0-9][0-9][0-9]/''}
            suffix=${suffix/_on_*/''}
          fi
          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"
        fi
        echo "branch suffix is: >$suffix<"

  tests-latest:
    name: "Install DPF latest"
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml
    needs: pick_server_suffix
    with:
      ANSYS_VERSION: ${{ inputs.ansys_version || vars.ANSYS_VERSION_DEFAULT }}
      python_versions: '["3.10"]'
      standalone_suffix: ${{ needs.pick_server_suffix.outputs.suffix }}
    secrets:
      PYANSYS_CI_BOT_TOKEN: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}

  docker_tests:
    name: "Install DPF on Docker"
    permissions:
      contents: read
    uses: ./.github/workflows/test_docker.yml
    needs: pick_server_suffix
    with:
      ANSYS_VERSION: ${{ inputs.ansys_version || vars.ANSYS_VERSION_DEFAULT }}
      standalone_suffix: ${{ needs.pick_server_suffix.outputs.suffix }}
    secrets:
      PYANSYS_CI_BOT_TOKEN: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}

  docker_examples:
    name: "Install DPF for Docker examples"
    permissions:
      contents: read
    uses: ./.github/workflows/examples_docker.yml
    needs: pick_server_suffix
    with:
      ANSYS_VERSION: ${{ inputs.ansys_version || vars.ANSYS_VERSION_DEFAULT }}
      python_versions: '["3.10"]'
      standalone_suffix: ${{ needs.pick_server_suffix.outputs.suffix }}
    secrets:
      PYANSYS_CI_BOT_TOKEN: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}

  docs:
    name: "Install DPF for documentation"
    if: |
      (startsWith(github.head_ref, 'main') || github.event.action == 'ready_for_review' || !github.event.pull_request.draft)
    permissions:
      contents: read
    uses: ./.github/workflows/docs.yml
    needs: pick_server_suffix
    with:
      ANSYS_VERSION: ${{ inputs.ansys_version || vars.ANSYS_VERSION_DEFAULT }}
      standalone_suffix: ${{ needs.pick_server_suffix.outputs.suffix }}
      event_name: ${{ github.event_name }}
      python_version: "3.12"
    secrets:
      PYANSYS_CI_BOT_TOKEN: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}

  examples:
    name: "Install DPF for examples"
    if: |
      (startsWith(github.head_ref, 'main') || github.event.action == 'ready_for_review' || !github.event.pull_request.draft)
    permissions:
      contents: read
    uses: ./.github/workflows/examples.yml
    needs: pick_server_suffix
    with:
      ANSYS_VERSION: ${{ inputs.ansys_version || vars.ANSYS_VERSION_DEFAULT }}
      python_versions: '["3.10"]'
      standalone_suffix: ${{ needs.pick_server_suffix.outputs.suffix }}
    secrets:
      PYANSYS_CI_BOT_TOKEN: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}

  pydpf-post:
    name: "Install DPF for PyDPF-Post"
    if: |
      (startsWith(github.head_ref, 'main') || github.event.action == 'ready_for_review' || !github.event.pull_request.draft)
    permissions:
      contents: read
    uses: ./.github/workflows/pydpf-post.yml
    needs: pick_server_suffix
    with:
      ANSYS_VERSION: ${{ inputs.ansys_version || vars.ANSYS_VERSION_DEFAULT }}
      standalone_suffix: ${{ needs.pick_server_suffix.outputs.suffix }}
    secrets:
      PYANSYS_CI_BOT_TOKEN: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}

  tests-retro:
    name: "Install DPF ${{ matrix.version.version }}${{ matrix.version.patch }}"
    if: |
      (startsWith(github.head_ref, 'main') || github.event.action == 'ready_for_review' || !github.event.pull_request.draft)
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - ${{ fromJson(vars.ANSYS_VERSIONS_RETRO_WITH_PATCH) }}
        include:
          - version: ${{ fromJson(vars.ANSYS_VERSION_LAST_RELEASED_WITH_PATCH) }}
    uses: ./.github/workflows/tests.yml
    with:
      ANSYS_VERSION: ${{ matrix.version.version }}
      python_versions: '["3.10"]'
      standalone_suffix: ${{ matrix.version.patch }}
    secrets:
      PYANSYS_CI_BOT_TOKEN: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}

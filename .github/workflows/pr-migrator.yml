name: "Migrate fork PR"
on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  hk-migrate-fork-pr:
    name: "Migrate fork PR to main repository"
    runs-on: ubuntu-latest
    if: |
      github.event.issue.pull_request != null &&
      (contains(github.event.comment.body, '@pyansys-ci-bot migrate') ||
       contains(github.event.comment.body, '@pyansys-ci-bot sync'))
    permissions:
      contents: write # Required to push the migration branch to the main repository
      pull-requests: write # Required to create pull requests, comments and reactions
    steps:

      - name: "Migrate fork PR"
        uses: ansys/actions/hk-migrate-fork-pr@87ff2e65e8884121f9afc97728ca9f213228ecc2 # v11.1.4
        with:
          pr-number: ${{ github.event.issue.number }}
          comment-id: ${{ github.event.comment.id }}
          user-triggering: ${{ github.event.comment.user.login }}
          github-token: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}
          bot-username: ${{ secrets.PYANSYS_CI_BOT_USERNAME }}
          bot-email: ${{ secrets.PYANSYS_CI_BOT_EMAIL }}
          team-slug: "pydpf-admins"

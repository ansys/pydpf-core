name: Install DPF for Docker examples # zizmor: ignore[concurrency-limits] , this is a reusable workflow

on:
  workflow_call:
    inputs:
      python_versions:
        required: false
        type: string
        default: '["3.10"]'
      ANSYS_VERSION:
        required: false
        type: string
      standalone_suffix:
        description: "Suffix of the branch on standalone"
        required: false
        type: string
        default: ''
    secrets:
      PYANSYS_CI_BOT_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      python_versions:
        description: "Python interpreters to use for DPF installation."
        required: true
        type: string
        default: '["3.10"]'
      ANSYS_VERSION:
        description: "ANSYS version to run."
        required: false
        type: string
      standalone_suffix:
        description: "Suffix of the branch on standalone"
        required: false
        type: string
        default: ''

permissions: {}

jobs:
  setup:
    name: "Setup"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      python_versions: ${{ steps.set_array.outputs.python_versions }}
    steps:
      - id: set_array
        env:
          PYTHON_VERSIONS: ${{ inputs.python_versions }}
        run: |
          echo "python_versions=${PYTHON_VERSIONS}" >> "$GITHUB_OUTPUT"

  examples:
    name: "Install DPF for Docker examples"
    needs: setup
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.setup.outputs.python_versions) }}
        os: ["ubuntu-latest"]
    steps:
      - name: "Install DPF"
        id: set-server-path
        uses: ansys/pydpf-actions/install-dpf-docker@195207a462b23da5645fde44ac685e81b29035a4 # v2.3
        with:
          dpf-standalone-TOKEN: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}
          standalone_suffix: ${{ inputs.standalone_suffix }}
          ANSYS_VERSION: ${{ inputs.ANSYS_VERSION || vars.ANSYS_VERSION_DEFAULT }}
